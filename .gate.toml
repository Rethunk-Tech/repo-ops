# Dependency hygiene: imports must resolve from declared dependencies, and
# declared dependencies must be imported. Detection cannot infer this one, so
# it is declared here.
#
# The scan root is src/ rather than "." — that is what makes the repo's own
# repo_ops_* packages resolve as first-party. See [tool.deptry] in
# pyproject.toml.
[gates.deps]
run = "uv run deptry src"

# Detection infers `ruff check` but not the formatter, so the CI step that
# rejects unformatted files had no local counterpart — which is how main came
# to fail it.
[gates.format]
run = "uv run ruff format --check ."
