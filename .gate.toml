# Dependency hygiene: imports must resolve from declared dependencies, and
# declared dependencies must be imported. Detection cannot infer this one, so
# it is declared here.
#
# The scan root is src/ rather than "." — that is what makes the repo's own
# repo_ops_* packages resolve as first-party. See [tool.deptry] in
# pyproject.toml.
[gates.deps]
run = "uv run deptry src"

# Coverage floor is `fail_under` in pyproject.toml; CI runs the same command.
[gates.test]
timeout = "5m"
run = 'uv run pytest -q -m "not integration" --cov'

# Mirrors CI's `uv build`; output goes to a throwaway dir.
[gates.build]
timeout = "3m"
run = 'uv build -o "$(mktemp -d)"'

# Matches verify.yml's pyrefly invocation (explicit path, tests and scripts excluded).
[gates.typecheck]
run = "uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'"
