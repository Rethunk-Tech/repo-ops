# Dependency hygiene: imports must resolve from declared dependencies, and
# declared dependencies must be imported. Detection cannot infer this one, so
# it is declared here.
#
# The scan root is src/ rather than "." — that is what makes the repo's own
# repo_ops_* packages resolve as first-party. See [tool.deptry] in
# pyproject.toml.
[gates.deps]
run = "uv run deptry src"

# Detection infers `ruff check` but not the formatter; this mirrors the CI step
# that rejects unformatted files.
[gates.format]
run = "uv run ruff format --check ."

# Same invocation and coverage floor as the CI test step.
[gates.test]
run = 'uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=78'
