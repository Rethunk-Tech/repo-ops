[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-ops"
version = "0.1.0"
description = "Repository operations and dependency maintenance tools for Rethunk-Tech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rethunk Tech" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/Rethunk-Tech/repo-ops"
Issues = "https://github.com/Rethunk-Tech/repo-ops/issues"
Changelog = "https://github.com/Rethunk-Tech/repo-ops/blob/main/CHANGELOG.md"

[project.scripts]
repo-dep-count = "repo_ops.commands.dep_count:main"
repo-dep-refresh = "repo_ops.commands.dep_refresh:main"
repo-pushed-commits = "repo_ops.commands.pushed_commits_24h:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
dev = ["ruff>=0.11.0", "pytest>=8"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
