[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[project]
name = "repo-ops"
version = "0.24.0"
description = "Repository operations and dependency maintenance tools for Rethunk-Tech."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rethunk Tech" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]
dependencies = ["ruamel.yaml>=0.18"]

[project.scripts]
repo-ops = "repo_ops.cli:main"

[project.urls]
Repository = "https://github.com/Rethunk-Tech/repo-ops"
Issues = "https://github.com/Rethunk-Tech/repo-ops/issues"
Changelog = "https://github.com/Rethunk-Tech/repo-ops/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "ruff>=0.11.0",
  "pytest>=8",
  "pytest-cov>=5.0",
  # The suite is wait-bound (subprocess tool probes, temp git repos), so it parallelises well.
  "pytest-xdist>=3.6",
  "pyrefly>=0.1",
  "deptry>=0.25.1",
]

# One distribution, many top-level modules. The module split is a code-layout
# choice; it deliberately does not imply separately installable distributions —
# every module ships in this wheel.
[tool.uv.build-backend]
module-root = "src"
module-name = [
  "repo_ops",
  "repo_ops_core",
  "repo_ops_models",
  "repo_ops_lockfiles",
  "repo_ops_js",
  "repo_ops_js_npm",
  "repo_ops_js_pnpm",
  "repo_ops_js_bun",
  "repo_ops_js_yarn",
  "repo_ops_go",
  "repo_ops_rust",
  "repo_ops_container",
  "repo_ops_py",
  "repo_ops_py_uv",
  "repo_ops_py_poetry",
  "repo_ops_py_pip_tools",
  "repo_ops_py_hatch",
  "repo_ops_py_pdm",
  "repo_ops_py_pipenv",
  "repo_ops_upgrade",
  "repo_ops_upgrade_remediations_core",
  "repo_ops_upgrade_remediations_js",
  "repo_ops_upgrade_remediations_py",
  "repo_ops_upgrade_remediations_go",
  "repo_ops_upgrade_remediations_rust",
  "repo_ops_upgrade_remediations_deno",
  "repo_ops_dependabot",
]

# deptry runs as `deptry src` (see .gate.toml). The module roots are under
# src/, and naming that directory as the scan root is what makes the 31
# repo_ops_* packages resolve as first-party — the alternative is listing every
# one of them in known_first_party by hand.
[tool.deptry.package_module_name_map]
# ruamel.yaml installs into the `ruamel` namespace package, so its import name
# is not derivable from the package name.
ruamel-yaml = ["ruamel"]

[tool.pytest.ini_options]
# The default lane excludes external-tool tests while retaining parallel workers. Pass -n0 for a
# debugging run, since --pdb needs a single process.
addopts = '-m "not integration" -n auto'
testpaths = ["tests"]
pythonpath = []
markers = [
  "integration: tests requiring real external tools (bun, yarn, npm registry, go, govulncheck audit, git network)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# First-party roots for isort. Without this the repo_ops_* modules classify as
# third-party and every import block reorders.
src = ["src"]
extend-exclude = [
  ".git",
  "__pycache__",
  ".ruff_cache",
  "build",
  "dist",
  ".venv",
  "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
# E501 (line length) is owned by the formatter. S603/S607 fire on essentially
# every subprocess call by design — invoking package managers (npm/pnpm/git/uv
# …) by name off PATH is repo-ops's entire purpose, not a vulnerability.
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.flake8-bandit]
# Drop /var/tmp from the flagged set. A fleet sweep extracts >100 GB of Yarn
# Berry cache, so it deliberately targets disk-backed scratch rather than the
# RAM-backed tmpfs /tmp is on many hosts; filling that takes the host down.
# The destination is always a 0700 random subdir via TemporaryDirectory(dir=...),
# so S108's predictable-path premise does not apply. /tmp and /dev/shm stay
# flagged — steering away from them is the entire point.
hardcoded-tmp-directory = ["/tmp", "/dev/shm"]

[tool.ruff.lint.per-file-ignores]
# Tests use bare `assert` (S101) and hardcoded /tmp fixture paths (S108).
"tests/**" = ["S101", "S108"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pyrefly]
# check-unannotated-defs is pyrefly's documented migration equivalent of mypy's
# disallow_untyped_defs (see migrating-from-mypy docs).
#
# CI/release pass an explicit path (`pyrefly check .`), which puts pyrefly in
# single-file mode — project-includes/project-excludes from this config are
# then ignored entirely (pyrefly docs: "Type Checking Modes"), so the CI/
# release commands also pass `--project-excludes tests/** scripts/**` on the
# CLI to keep the checked scope equal to project-includes below.
project-includes = ["src"]
check-unannotated-defs = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
