[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "repo-ops-workspace"
version = "0.20.0"
description = "Repository operations and dependency maintenance tools for Rethunk-Tech (uv workspace root)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rethunk Tech" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Rethunk-Tech/repo-ops"
Issues = "https://github.com/Rethunk-Tech/repo-ops/issues"
Changelog = "https://github.com/Rethunk-Tech/repo-ops/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "repo-ops",
  "repo-ops-core",
  "repo-ops-models",
  "repo-ops-lockfiles",
  "repo-ops-js",
  "repo-ops-js-npm",
  "repo-ops-js-pnpm",
  "repo-ops-js-bun",
  "repo-ops-js-yarn",
  "repo-ops-go",
  "repo-ops-rust",
  "repo-ops-container",
  "repo-ops-py",
  "repo-ops-py-uv",
  "repo-ops-py-poetry",
  "repo-ops-py-pip-tools",
  "repo-ops-py-hatch",
  "repo-ops-py-pdm",
  "repo-ops-py-pipenv",
  "repo-ops-upgrade",
  "repo-ops-upgrade-remediations-core",
  "repo-ops-upgrade-remediations-js",
  "repo-ops-upgrade-remediations-py",
  "repo-ops-upgrade-remediations-go",
  "repo-ops-upgrade-remediations-rust",
  "repo-ops-upgrade-remediations-deno",
  "repo-ops-inventory",
  "repo-ops-pushed",
  "repo-ops-audit",
  "repo-ops-dependabot",
  "repo-ops-doctor",
  "ruff>=0.11.0",
  "pytest>=8",
  "pytest-cov>=5.0",
  "mypy>=1.10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
repo-ops = { workspace = true }
repo-ops-core = { workspace = true }
repo-ops-models = { workspace = true }
repo-ops-lockfiles = { workspace = true }
repo-ops-js = { workspace = true }
repo-ops-js-npm = { workspace = true }
repo-ops-js-pnpm = { workspace = true }
repo-ops-js-bun = { workspace = true }
repo-ops-js-yarn = { workspace = true }
repo-ops-go = { workspace = true }
repo-ops-rust = { workspace = true }
repo-ops-container = { workspace = true }
repo-ops-py = { workspace = true }
repo-ops-py-uv = { workspace = true }
repo-ops-py-poetry = { workspace = true }
repo-ops-py-pip-tools = { workspace = true }
repo-ops-py-hatch = { workspace = true }
repo-ops-py-pdm = { workspace = true }
repo-ops-py-pipenv = { workspace = true }
repo-ops-upgrade = { workspace = true }
repo-ops-upgrade-remediations-core = { workspace = true }
repo-ops-upgrade-remediations-js = { workspace = true }
repo-ops-upgrade-remediations-py = { workspace = true }
repo-ops-upgrade-remediations-go = { workspace = true }
repo-ops-upgrade-remediations-rust = { workspace = true }
repo-ops-upgrade-remediations-deno = { workspace = true }
repo-ops-inventory = { workspace = true }
repo-ops-pushed = { workspace = true }
repo-ops-audit = { workspace = true }
repo-ops-dependabot = { workspace = true }
repo-ops-doctor = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages/repo-ops-lockfiles/tests", "packages/repo-ops-audit/tests"]
pythonpath = []
markers = [
  "integration: tests requiring real external tools (bun, yarn, npm registry, go, govulncheck audit, git network)",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".git", "__pycache__", ".ruff_cache", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
# E501 (line length) is owned by the formatter. S603/S607 fire on essentially
# every subprocess call by design — invoking package managers (npm/pnpm/git/uv
# …) by name off PATH is repo-ops's entire purpose, not a vulnerability.
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests use bare `assert` (S101) and hardcoded /tmp fixture paths (S108).
"**/tests/**" = ["S101", "S108"]
"tests/**" = ["S101", "S108"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
strict_optional = true
show_error_codes = true
ignore_missing_imports = true
packages = [
  "repo_ops_core",
  "repo_ops_models",
  "repo_ops_lockfiles",
  "repo_ops_js",
  "repo_ops_js_npm",
  "repo_ops_js_pnpm",
  "repo_ops_js_bun",
  "repo_ops_js_yarn",
  "repo_ops_go",
  "repo_ops_rust",
  "repo_ops_container",
  "repo_ops_py",
  "repo_ops_py_uv",
  "repo_ops_py_poetry",
  "repo_ops_py_pip_tools",
  "repo_ops_py_hatch",
  "repo_ops_py_pdm",
  "repo_ops_py_pipenv",
  "repo_ops_upgrade",
  "repo_ops_upgrade_remediations_core",
  "repo_ops_upgrade_remediations_js",
  "repo_ops_upgrade_remediations_py",
  "repo_ops_upgrade_remediations_go",
  "repo_ops_upgrade_remediations_rust",
  "repo_ops_upgrade_remediations_deno",
  "repo_ops_inventory",
  "repo_ops_pushed",
  "repo_ops_audit",
  "repo_ops_dependabot",
  "repo_ops_doctor",
  "repo_ops",
]

[tool.coverage.run]
source = [
  "packages/repo-ops-core/src",
  "packages/repo-ops-models/src",
  "packages/repo-ops-lockfiles/src",
  "packages/repo-ops-js/src",
  "packages/repo-ops-js-npm/src",
  "packages/repo-ops-js-pnpm/src",
  "packages/repo-ops-js-bun/src",
  "packages/repo-ops-js-yarn/src",
  "packages/repo-ops-go/src",
  "packages/repo-ops-rust/src",
  "packages/repo-ops-container/src",
  "packages/repo-ops-py/src",
  "packages/repo-ops-py-uv/src",
  "packages/repo-ops-py-poetry/src",
  "packages/repo-ops-py-pip-tools/src",
  "packages/repo-ops-py-hatch/src",
  "packages/repo-ops-py-pdm/src",
  "packages/repo-ops-py-pipenv/src",
  "packages/repo-ops-upgrade/src",
  "packages/repo-ops-upgrade-remediations-core/src",
  "packages/repo-ops-upgrade-remediations-js/src",
  "packages/repo-ops-upgrade-remediations-py/src",
  "packages/repo-ops-upgrade-remediations-go/src",
  "packages/repo-ops-upgrade-remediations-rust/src",
  "packages/repo-ops-upgrade-remediations-deno/src",
  "packages/repo-ops-inventory/src",
  "packages/repo-ops-pushed/src",
  "packages/repo-ops-audit/src",
  "packages/repo-ops-dependabot/src",
  "packages/repo-ops-doctor/src",
  "packages/repo-ops/src",
]
branch = true

# Strict-annotation overrides: packages confirmed clean under disallow_untyped_defs.
[[tool.mypy.overrides]]
