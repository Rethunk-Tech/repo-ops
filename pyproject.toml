[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[project]
name = "repo-ops"
version = "0.2.3"
description = "Repository operations and dependency maintenance tools for Rethunk-Tech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Rethunk Tech" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Rethunk-Tech/repo-ops"
Issues = "https://github.com/Rethunk-Tech/repo-ops/issues"
Changelog = "https://github.com/Rethunk-Tech/repo-ops/blob/main/CHANGELOG.md"

# PEP 621 console scripts (installed by uv tool / uv sync; run locally via uv run <name>)
[project.scripts]
repos-inventory = "repo_ops.inventory.scan:main"
repos-upgrade-plan = "repo_ops.upgrade.run:main_plan"
repos-upgrade-apply = "repo_ops.upgrade.run:main_apply"
repos-pushed = "repo_ops.pushed.audit:main"
repo-ops = "repo_ops.commands.dispatch:main"

[dependency-groups]
dev = [
  "ruff>=0.11.0",
  "pytest>=8",
  "pytest-cov>=5.0",
  "mypy>=1.10",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
strict_optional = true
show_error_codes = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/repo_ops"]
branch = true
# Note: upgrade/ecosystems/* and CLI entrypoints have low coverage by design;
# threshold targets shared libs plus partial command coverage.
[tool.coverage.report]
fail_under = 15  # shared libs (filesystem/git/counting) higher; upgrade orchestration tested lightly
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
