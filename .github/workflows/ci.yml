name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.14"
            continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'
      - run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=68
      - run: uv build
      - run: ls -l dist/

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: Rethunk-Tech/gh-actions/setup-bun@e04e0afa3e00c59e33030fdbc7df29c15000357b # v1.7
        with:
          node-version: "24"
          skip-install: "true"
      - name: Enable Corepack (yarn)
        run: corepack enable
      - uses: Rethunk-Tech/gh-actions/setup-go@e04e0afa3e00c59e33030fdbc7df29c15000357b # v1.7
        with:
          go-version: "stable"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Integration tests (advisory)
        run: uv run pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Audit third-party dependencies for known CVEs
        # --skip-editable drops the editable local install of repo-ops itself;
        # only the resolved third-party dependency tree is audited.
        run: uv run --with pip-audit pip-audit --skip-editable
