name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Doc audit (strict tier + README 7-part)
        run: uv run python scripts/doc_audit_gate.py --root .
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/repo_ops
      - run: uv run pytest -q --cov=src/repo_ops --cov-report=term-missing --cov-fail-under=15
      - run: uv build
      - run: ls -l dist/
