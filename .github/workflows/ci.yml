name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    uses: ./.github/workflows/verify.yml
    with:
      python-version: ${{ matrix.python-version }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-python@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          python-version: "3.14"
          install-args: --locked --group dev
      - uses: Rethunk-Tech/gh-actions/setup-bun@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          node-version: "24"
          skip-install: "true"
      - name: Enable Corepack (yarn)
        run: corepack enable
      - uses: Rethunk-Tech/gh-actions/setup-go@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        id: setup-go
        with:
          go-version: "stable"
      # The integration tests shell out to a govulncheck binary, so the helper's run-govulncheck
      # gate does not fit. Building it costs 26s; the key carries the Go version because the
      # binary type-checks with the toolchain it was built by.
      - name: Resolve govulncheck version
        id: govulncheck
        run: echo "version=$(go list -m -f '{{.Version}}' golang.org/x/vuln@latest)" >> "$GITHUB_OUTPUT"
      - name: Cache govulncheck
        id: govulncheck-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/govulncheck
          key: ${{ runner.os }}-govulncheck-${{ steps.govulncheck.outputs.version }}-go${{ steps.setup-go.outputs.go-version }}
      - name: Install govulncheck
        if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        env:
          GOVULNCHECK_VERSION: ${{ steps.govulncheck.outputs.version }}
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Integration tests (advisory)
        run: uv run pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Audits uv.lock rather than the installed environment, so pinned-but-uninstalled
      # extras are covered and a lock full of advisories cannot pass. No sync: the audit
      # reads the lockfile, not the environment.
      - uses: Rethunk-Tech/gh-actions/setup-python@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          python-version: "3.14"
          skip-install: "true"
          run-audit: "true"
