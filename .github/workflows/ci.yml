name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue-on-error == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
        - python-version: "3.14"
          continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Sync locked dependencies
      run: uv sync --locked --group dev
    - name: Import boundaries (workspace packages)
      run: uv run python scripts/check_import_boundaries.py
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - name: Mypy (workspace packages)
      run: |
        uv run mypy \
          packages/repo-ops-core/src \
          packages/repo-ops-models/src \
          packages/repo-ops-lockfiles/src \
          packages/repo-ops-js/src \
          packages/repo-ops-js-npm/src \
          packages/repo-ops-js-pnpm/src \
          packages/repo-ops-js-bun/src \
          packages/repo-ops-js-yarn/src \
          packages/repo-ops-go/src \
          packages/repo-ops-rust/src \
          packages/repo-ops-py/src \
          packages/repo-ops-py-uv/src \
          packages/repo-ops-py-poetry/src \
          packages/repo-ops-py-pip-tools/src \
          packages/repo-ops-py-hatch/src \
          packages/repo-ops-upgrade/src \
          packages/repo-ops-upgrade-remediations-js/src \
          packages/repo-ops-inventory/src \
          packages/repo-ops-pushed/src \
          packages/repo-ops/src
    - run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=68
    - run: uv build packages/repo-ops
    - run: ls -l dist/

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: "3.12"
        enable-cache: true
    - uses: oven-sh/setup-bun@v2
    - uses: actions/setup-go@v6
      with:
        go-version: "stable"
    - name: Sync locked dependencies
      run: uv sync --locked --group dev
    - name: Integration tests (advisory)
      run: uv run pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Sync locked dependencies
      run: uv sync --locked --group dev
    - name: Audit third-party dependencies for known CVEs
      # --skip-editable drops the local workspace packages (not on PyPI);
      # only the resolved third-party dependency tree is audited.
      run: uv run --with pip-audit pip-audit --skip-editable
