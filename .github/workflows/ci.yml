name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    uses: ./.github/workflows/verify.yml
    with:
      python-version: ${{ matrix.python-version }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: Rethunk-Tech/gh-actions/setup-bun@45d60bff5148282bbbf11e6f2460829eab772cf2 # v1.9
        with:
          node-version: "24"
          skip-install: "true"
      - name: Enable Corepack (yarn)
        run: corepack enable
      - uses: Rethunk-Tech/gh-actions/setup-go@45d60bff5148282bbbf11e6f2460829eab772cf2 # v1.9
        with:
          go-version: "stable"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Integration tests (advisory)
        run: uv run pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Audit dependencies for known CVEs
        # Audits uv.lock rather than the installed environment, so pinned-but-
        # uninstalled extras are covered and a lock full of advisories cannot pass.
        run: uv audit --locked
