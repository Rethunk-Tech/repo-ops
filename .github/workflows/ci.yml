name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    uses: ./.github/workflows/verify.yml
    with:
      python-version: ${{ matrix.python-version }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-python@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          python-version: "3.14"
          install-args: --locked --group dev
      - uses: Rethunk-Tech/gh-actions/setup-bun@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          node-version: "24"
          skip-install: "true"
      - name: Enable Corepack (yarn)
        run: corepack enable
      - uses: Rethunk-Tech/gh-actions/setup-go@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          go-version: "stable"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Integration tests (advisory)
        run: uv run pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Audits uv.lock rather than the installed environment, so pinned-but-uninstalled
      # extras are covered and a lock full of advisories cannot pass. No sync: the audit
      # reads the lockfile, not the environment.
      - uses: Rethunk-Tech/gh-actions/setup-python@5d07bd8adb2dda1caa11cacd886edf73e2e95afb # v1.10
        with:
          python-version: "3.14"
          skip-install: "true"
          run-audit: "true"
