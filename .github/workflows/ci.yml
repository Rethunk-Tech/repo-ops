name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Doc audit (strict tier + README 7-part)
        run: python3 scripts/doc_audit_gate.py --root .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/repo_ops
      - run: pytest -q --cov=src/repo_ops --cov-report=term-missing --cov-fail-under=15
      - run: python -m pip install build && python -m build --wheel --sdist
      - run: ls -l dist/
