name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    uses: ./.github/workflows/verify.yml
    with:
      python-version: ${{ matrix.python-version }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-python@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          python-version: "3.14"
          install-args: --locked --group dev
      - uses: Rethunk-Tech/gh-actions/setup-bun@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          node-version: "24"
          skip-install: "true"
      - name: Enable Corepack (yarn)
        run: corepack enable
      - uses: Rethunk-Tech/gh-actions/setup-go@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          go-version: "stable"
      - name: Integration tests (advisory)
        run: uv run pytest -q -m integration

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Audits uv.lock rather than the installed environment, so pinned-but-uninstalled
      # extras are covered and a lock full of advisories cannot pass. No sync: the audit
      # reads the lockfile, not the environment.
      - uses: Rethunk-Tech/gh-actions/setup-python@99dfb9093ab089d28f76d8036322a7c062259e76 # v1.13
        with:
          python-version: "3.14"
          skip-install: "true"
          run-audit: "true"
