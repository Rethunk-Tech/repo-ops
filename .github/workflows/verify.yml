name: Verify

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      upload-dist:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-python@4c3240b9077c81a6f03f499dafaec6494220aad5 # v1.27
        with:
          python-version: ${{ inputs.python-version }}
          install-args: --locked --group dev
          run-ruff: "true"
          run-ruff-format: "true"
      - run: uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'
      - name: Allow nested user namespaces for the sandbox tests
        # Ubuntu refuses unprivileged user namespaces inside a bwrap child by default, which is
        # what test_run_allows_nested_bwrap exercises. The key is absent on kernels that never
        # restricted them, so this is a no-op there.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: dbg
        continue-on-error: true
        run: |
          sysctl -a 2>/dev/null | grep -Ei 'userns|max_user_namespaces'
          ls -l /dev/net/tun; which bwrap; dpkg -l bubblewrap | tail -1
          echo A; bwrap --ro-bind / / --dev /dev --unshare-user true; echo rc=$?
          echo B; bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp bwrap --ro-bind / / --dev /dev --unshare-user true; echo rc=$?
          echo C; bwrap --ro-bind / / --dev /dev --dev-bind-try /dev/net/tun /dev/net/tun --proc /proc --tmpfs /tmp bwrap --ro-bind / / --dev /dev --unshare-user true; echo rc=$?
          echo D; bwrap --ro-bind / / --dev /dev --proc /proc bwrap --ro-bind / / --dev /dev --unshare-user true; echo rc=$?
          echo E; bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp bwrap --ro-bind / / --unshare-user true; echo rc=$?
          sudo aa-status 2>&1 | head -20; sudo dmesg | grep -i apparmor | tail -5
      - name: Run tests
        run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=83
      - name: Build installable wheel and sdist
        run: uv build
      - name: List artifacts
        run: ls -la dist/
      - name: Upload dist artifact
        if: inputs.upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
