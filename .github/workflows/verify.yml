name: Verify

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      upload-dist:
        required: false
        type: boolean
        default: false
      continue-on-error:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.continue-on-error }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'
      - name: Run tests
        run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=78
      - name: Build installable wheel and sdist
        run: uv build
      - name: List artifacts
        run: ls -la dist/
      - name: Upload dist artifact
        if: inputs.upload-dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
