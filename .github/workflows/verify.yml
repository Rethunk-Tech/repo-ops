name: Verify

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      upload-dist:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-python@71da648f666fb49a8e72d0576a4d8db97894ccaf # v1.29.1
        with:
          python-version: ${{ inputs.python-version }}
          install-args: --locked --group dev
          run-ruff: "true"
          run-ruff-format: "true"
      - run: uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'
      - name: Allow nested user namespaces for the sandbox tests
        # test_run_allows_nested_bwrap runs bwrap inside the sandbox's bwrap. Ubuntu's
        # bwrap-userns-restrict profile stops a bwrap child creating a user namespace, and that
        # profile is also what lets bwrap itself unshare while the sysctl restricts userns, so
        # lift the sysctl first or unloading the profile breaks every bwrap call.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
      - name: Run tests
        run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=83
      - name: Build installable wheel and sdist
        run: uv build
      - name: List artifacts
        run: ls -la dist/
      - name: Upload dist artifact
        if: inputs.upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
