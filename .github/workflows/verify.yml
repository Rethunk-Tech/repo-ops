name: Verify

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      upload-dist:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-python@5992e857707202bc73acf8a0a854add36ece781e # v1.21
        with:
          python-version: ${{ inputs.python-version }}
          install-args: --locked --group dev
          run-ruff: "true"
          run-ruff-format: "true"
      - run: uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'
      - name: Run tests
        run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=78
      - name: Build installable wheel and sdist
        run: uv build
      - name: List artifacts
        run: ls -la dist/
      - name: Upload dist artifact
        if: inputs.upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
