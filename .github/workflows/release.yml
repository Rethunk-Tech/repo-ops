name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Import boundaries (workspace packages)
        run: uv run python scripts/check_import_boundaries.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Pyrefly (workspace packages)
        run: uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'
      - name: Run tests
        run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=68 tests packages/repo-ops-audit/tests packages/repo-ops-lockfiles/tests packages/repo-ops-py-pdm/tests packages/repo-ops-py-pipenv/tests
      - name: Build installable wheel and sdist
        run: uv build packages/repo-ops
      - name: List artifacts
        run: ls -la dist/
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          scripts/extract_changelog_section.sh "$version" CHANGELOG.md "$notes_file"
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --notes-file "$RELEASE_NOTES_FILE" dist/*
      - name: Upload dist artifact for PyPI publish
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
