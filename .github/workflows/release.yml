name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Import boundaries (workspace packages)
        run: uv run python scripts/check_import_boundaries.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Pyrefly (workspace packages)
        run: uv run pyrefly check . --project-excludes 'tests/**' 'scripts/**'
      - name: Run tests
        run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=68 tests packages/repo-ops-audit/tests packages/repo-ops-lockfiles/tests packages/repo-ops-py-pdm/tests packages/repo-ops-py-pipenv/tests
      - name: Build installable wheel and sdist
        run: uv build packages/repo-ops
      - name: List artifacts
        run: ls -la dist/
      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$version" '
            $0 == "## [" version "]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]] || [[ -z "$(tr -d '[:space:]' < "$notes_file")" ]]; then
            echo "::error::No non-empty CHANGELOG.md section found for ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ env.RELEASE_NOTES_FILE }}
      - name: Upload dist artifact for PyPI publish
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
