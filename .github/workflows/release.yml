name: Release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v8.3.2
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Sync locked dependencies
      run: uv sync --locked --group dev
    - name: Import boundaries (workspace packages)
      run: uv run python scripts/check_import_boundaries.py
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - name: Mypy (workspace packages)
      run: |
        uv run mypy \
          packages/repo-ops-core/src \
          packages/repo-ops-models/src \
          packages/repo-ops-lockfiles/src \
          packages/repo-ops-js/src \
          packages/repo-ops-js-npm/src \
          packages/repo-ops-js-pnpm/src \
          packages/repo-ops-js-bun/src \
          packages/repo-ops-js-yarn/src \
          packages/repo-ops-go/src \
          packages/repo-ops-rust/src \
          packages/repo-ops-container/src \
          packages/repo-ops-py/src \
          packages/repo-ops-py-uv/src \
          packages/repo-ops-py-poetry/src \
          packages/repo-ops-py-pip-tools/src \
          packages/repo-ops-py-hatch/src \
          packages/repo-ops-py-pdm/src \
          packages/repo-ops-py-pipenv/src \
          packages/repo-ops-upgrade/src \
          packages/repo-ops-upgrade-remediations-core/src \
          packages/repo-ops-upgrade-remediations-js/src \
          packages/repo-ops-upgrade-remediations-go/src \
          packages/repo-ops-upgrade-remediations-py/src \
          packages/repo-ops-upgrade-remediations-rust/src \
          packages/repo-ops-upgrade-remediations-deno/src \
          packages/repo-ops-inventory/src \
          packages/repo-ops-pushed/src \
          packages/repo-ops-audit/src \
          packages/repo-ops-dependabot/src \
          packages/repo-ops-doctor/src \
          packages/repo-ops/src
    - name: Run tests
      run: uv run pytest -q -m "not integration" --cov --cov-report=term-missing --cov-fail-under=68 tests packages/repo-ops-audit/tests packages/repo-ops-lockfiles/tests packages/repo-ops-py-pdm/tests packages/repo-ops-py-pipenv/tests
    - name: Build installable wheel and sdist
      run: uv build packages/repo-ops
    - name: List artifacts
      run: ls -la dist/
    - name: Upload release assets
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
    - name: Upload dist artifact for PyPI publish
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download dist artifact
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
