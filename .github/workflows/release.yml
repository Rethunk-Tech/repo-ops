name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    # A called workflow gets no more than its caller grants, and verify.yml asks for contents: read.
    permissions:
      contents: read
    with:
      python-version: "3.14"
      upload-dist: true

  # No contents: write in this job. It runs checkout, the build and attestation, and the
  # token that can publish a release is deliberately not in scope while any of that happens.
  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attest the built files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 brings the annotated tag OBJECT, not just the commit it points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release from the tag's own annotation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          body=$(git tag -l --format='%(contents:body)' "$TAG")
          [ -n "$subject" ] || subject=$(git log -1 --format='%s' "$TAG")
          [ -n "$body" ] || body=$(git log -1 --format='%b' "$TAG")
          gh release create "$TAG" \
            --title "$TAG — $subject" \
            --notes "${body:-$subject}" \
            --verify-tag \
            dist/*

  move-major:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move the floating major tag to this release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^(v[0-9]+)\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "$TAG is not a vN.M release; no floating major to move."
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          newest=$(git tag -l --sort=-v:refname "${major}.*" | grep -E "^${major}\.[0-9]+(\.[0-9]+)?$" | head -1)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest $major release ($newest); leaving $major where it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "$major -> $TAG" "$TAG^{commit}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin "refs/tags/$major"
