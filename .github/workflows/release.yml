name: Release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v8.2.0
      with:
        python-version: "3.12"
        enable-cache: true
    - name: Sync locked dependencies
      run: uv sync --locked --group dev
    - name: Run tests
      run: uv run pytest -q
    - name: Build installable wheel and sdist
      run: uv build packages/repo-ops
    - name: List artifacts
      run: ls -la dist/
    - name: Upload release assets
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
    - name: Upload dist artifact for PyPI publish
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish-pypi:
    name: Publish to PyPI (OIDC trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download dist artifact
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
