name: Bug report
description: Report a bug in repo-ops
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
      placeholder: |
        Steps to reproduce:
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, `repo-ops --version` or git SHA (install/verify — HUMANS.md)
      placeholder: "Python 3.12, Fedora 44, repo-ops 0.5.0 or git SHA"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
        - label: I am willing to provide a PR if asked
