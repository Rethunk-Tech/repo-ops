[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[project]
name = "repo-ops-upgrade-remediations-rust"
version = "0.22.3"
requires-python = ">=3.10"
dependencies = [
  "repo-ops-core",
  "repo-ops-models",
  "repo-ops-upgrade-remediations-core",
]

[tool.uv.sources]
repo-ops-core = { workspace = true }
repo-ops-models = { workspace = true }
repo-ops-upgrade-remediations-core = { workspace = true }
