[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[project]
name = "repo-ops-lockfiles"
version = "0.15.0"
requires-python = ">=3.10"
dependencies = [
  "repo-ops-core",
  "repo-ops-models",
]

[tool.uv.sources]
repo-ops-core = { workspace = true }
repo-ops-models = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]
