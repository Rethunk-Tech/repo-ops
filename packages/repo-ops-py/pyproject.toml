[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[project]
name = "repo-ops-py"
version = "0.19.0"
requires-python = ">=3.10"
dependencies = [
  "repo-ops-core",
  "repo-ops-models",
  "repo-ops-upgrade",
  "repo-ops-py-pdm",
  "repo-ops-py-pipenv",
]

[tool.uv.sources]
repo-ops-core = { workspace = true }
repo-ops-models = { workspace = true }
repo-ops-upgrade = { workspace = true }
repo-ops-py-pdm = { workspace = true }
repo-ops-py-pipenv = { workspace = true }
